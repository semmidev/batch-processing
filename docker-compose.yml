version: "3.8"

services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: middleware_user
      POSTGRES_PASSWORD: "YourStrong!Password"
      POSTGRES_DB: middleware_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middleware_user -d middleware_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migration:
    image: migrate/migrate:v4.17.0
    container_name: db_migration
    volumes:
      - ./migrations:/migrations
    command: -path=/migrations -database "postgres://middleware_user:YourStrong!Password@postgres:5432/middleware_db?sslmode=disable" up
    depends_on:
      postgres:
        condition: service_healthy

  middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: middleware
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=middleware_db
      - DB_USER=middleware_user
      - DB_PASSWORD=YourStrong!Password
      - SYSTEM_C_BASE_URL=http://systemc:8081
      - SYSTEM_C_API_KEY=system-c-key
      - SYSTEM_C_TIMEOUT_SECONDS=30
      - SYSTEM_C_RATE_LIMIT_PER_SECOND=200
      - API_KEY_HEADER=Authorization
      - VALID_API_KEYS=key1,key2
      - WEBHOOK_MAX_RETRIES=5
      - WEBHOOK_SIGNING_ALGORITHM=sha256
      - LOG_LEVEL=info
      # Worker tuning for massive batches
      - WORKER_COUNT=20
      - ITEMS_PER_POLL=100
      - POLL_INTERVAL_SECONDS=1
      # Circuit breaker — tolerant of ~10% deterministic failures
      - CB_MAX_REQUESTS_HALF_OPEN=20
      - CB_OPEN_TIMEOUT_SECONDS=15
      - CB_MIN_REQUESTS_TO_TRIP=50
      - CB_FAILURE_RATIO_THRESHOLD=0.6
    depends_on:
      postgres:
        condition: service_healthy
      db-migration:
        condition: service_completed_successfully

  systemc:
    build:
      context: ./simulators/systemc
      dockerfile: Dockerfile
    container_name: systemc
    ports:
      - "8081:8081"
    environment:
      - SYSTEM_C_PORT=8081
      - SYSTEM_C_API_KEY=system-c-key
      - SYSTEM_C_LATENCY_MS=20
      - SYSTEM_C_FAILURE_RATE=0.0
      - SYSTEM_C_FAIL_ID_PATTERN=fail-item
    restart: always

  systema:
    build:
      context: . # repo root — go.mod must be accessible
      dockerfile: simulators/systema/Dockerfile
    container_name: systema
    ports:
      - "8082:8082"
    environment:
      - SYSTEM_A_PORT=8082
      - MIDDLEWARE_URL=http://middleware:8080
      - WEBHOOK_URL=http://systema:8082/webhook
      - MIDDLEWARE_API_KEY=key1
      - WEBHOOK_SECRET=some-generated-secret
      # DB — System A reads/writes systema_items in the shared Postgres instance
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=middleware_db
      - DB_USER=middleware_user
      - DB_PASSWORD=YourStrong!Password
      # Sender loop tuning
      - SENDER_INTERVAL_SECONDS=5
      - SENDER_BATCH_SIZE=500
      - MAX_RETRIES=5
      # Auto-seeder: 10 batches × 500 items, 50 fail each = 5000 total rows on startup
      - AUTO_TRIGGER=true
      - AUTO_BATCHES=10
      - AUTO_SIZE=500
      - AUTO_FAIL_COUNT=0
    depends_on:
      middleware:
        condition: service_started
      db-migration:
        condition: service_completed_successfully
